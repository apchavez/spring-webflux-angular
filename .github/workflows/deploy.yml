name: Deploy to Kubernetes

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to ephemeral kind cluster and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: false
          load: true
          tags: spring-webflux-angular-api:ci

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: false
          load: true
          tags: spring-webflux-angular-web:ci

      - name: Create ephemeral kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: product-service-ci

      - name: Load images into kind
        run: |
          kind load docker-image spring-webflux-angular-api:ci --name product-service-ci
          kind load docker-image spring-webflux-angular-web:ci --name product-service-ci

      - name: Deploy chart with Helm
        run: |
          helm upgrade --install product-service ./chart \
            --namespace product-service \
            --create-namespace \
            --set api.image.repository=spring-webflux-angular-api \
            --set api.image.tag=ci \
            --set api.image.pullPolicy=IfNotPresent \
            --set web.image.repository=spring-webflux-angular-web \
            --set web.image.tag=ci \
            --set web.image.pullPolicy=IfNotPresent \
            --set secrets.dbUser=ci_user \
            --set secrets.dbPassword=ci_password \
            --set secrets.kafkaPassword=ci_password \
            --set secrets.redisPassword=ci_password \
            --wait --timeout=300s

      - name: Verify rollout status
        run: |
          kubectl rollout status deployment/product-service -n product-service --timeout=180s
          kubectl rollout status deployment/product-web -n product-service --timeout=180s
          kubectl rollout status deployment/postgres -n product-service --timeout=180s
          kubectl rollout status deployment/redis -n product-service --timeout=180s
          kubectl rollout status deployment/kafka -n product-service --timeout=180s

      - name: Smoke test API health endpoint
        run: |
          kubectl run smoke-test --rm -i --restart=Never --image=curlimages/curl:8.11.1 \
            -n product-service -- \
            curl -sf --retry 10 --retry-delay 5 --retry-connrefused \
            http://product-service:80/actuator/health/readiness

      - name: Smoke test web frontend
        run: |
          kubectl run smoke-test-web --rm -i --restart=Never --image=curlimages/curl:8.11.1 \
            -n product-service -- \
            curl -sf --retry 5 --retry-delay 5 --retry-connrefused \
            http://product-web:80/

      - name: Show pod status on failure
        if: failure()
        run: |
          kubectl get pods -n product-service
          kubectl describe pods -n product-service
          kubectl logs -n product-service -l app.kubernetes.io/name=product-service --tail=200 || true

      - name: Tear down kind cluster
        if: always()
        run: kind delete cluster --name product-service-ci
