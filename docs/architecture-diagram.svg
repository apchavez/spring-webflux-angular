<svg viewBox="0 0 1180 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="460" fill="#f8fafc" />

  <text x="20" y="34" font-size="20" font-weight="700" fill="#0f172a">spring-webflux-angular — Product Management Platform</text>
  <text x="20" y="56" font-size="13" fill="#64748b">Spring Boot WebFlux (reactivo) + Angular + PostgreSQL/R2DBC + Redis + Kafka, Hexagonal, Kubernetes</text>

  <g>
    <rect x="30" y="110" width="150" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
    <text x="105" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">Cliente Angular</text>
    <text x="105" y="153" text-anchor="middle" font-size="10" fill="#4338ca">SPA</text>
  </g>

  <g>
    <rect x="220" y="110" width="170" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <text x="305" y="135" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">ProductController</text>
    <text x="305" y="153" text-anchor="middle" font-size="9.5" fill="#1e40af">adaptador REST</text>
  </g>

  <g>
    <rect x="430" y="110" width="200" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="530" y="135" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">ProductApplicationService</text>
    <text x="530" y="153" text-anchor="middle" font-size="9.5" fill="#166534">capa de aplicación</text>
  </g>

  <g>
    <rect x="670" y="60" width="200" height="55" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" />
    <text x="770" y="83" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">ProductDomainService</text>
    <text x="770" y="99" text-anchor="middle" font-size="9.5" fill="#166534">capa de dominio</text>
  </g>

  <g>
    <rect x="670" y="140" width="200" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <text x="770" y="163" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">ProductRepositoryPort</text>
    <text x="770" y="179" text-anchor="middle" font-size="9.5" fill="#1e40af">puerto de salida</text>
  </g>

  <g>
    <rect x="910" y="110" width="240" height="60" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5" />
    <text x="1030" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">ProductPersistenceAdapter</text>
    <text x="1030" y="153" text-anchor="middle" font-size="9.5" fill="#3730a3">cache-aside</text>
  </g>

  <g>
    <rect x="670" y="240" width="180" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="760" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Redis</text>
    <text x="760" y="283" text-anchor="middle" font-size="10" fill="#991b1b">Caché + Rate Limit</text>
  </g>

  <g>
    <ellipse cx="1030" cy="270" rx="120" ry="40" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="1030" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">PostgreSQL (R2DBC)</text>
    <text x="1030" y="283" text-anchor="middle" font-size="9.5" fill="#92400e">reactivo, no bloqueante</text>
  </g>

  <g>
    <rect x="220" y="240" width="200" height="60" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5" />
    <text x="320" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#701a75">KafkaProductEventPublisher</text>
    <text x="320" y="283" text-anchor="middle" font-size="9.5" fill="#86198f">ProductEventPublisherPort</text>
  </g>

  <g>
    <rect x="30" y="240" width="150" height="60" rx="10" fill="#f3e8ff" stroke="#a21caf" stroke-width="1.5" />
    <text x="105" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#701a75">Kafka</text>
    <text x="105" y="283" text-anchor="middle" font-size="9.5" fill="#86198f">product-events</text>
  </g>

  <g>
    <rect x="30" y="340" width="1120" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="50" y="366" font-size="12" font-weight="700" fill="#0f172a">Notas de diseño</text>
    <text x="50" y="388" font-size="10.5" fill="#334155">Arquitectura Hexagonal (Ports &amp; Adapters), stack 100% reactivo/no-bloqueante (WebFlux + R2DBC + reactor-kafka). Además cuenta con un</text>
    <text x="50" y="406" font-size="10.5" fill="#334155">módulo Spring Batch para import CSV masivo — exclusivo de este repo, no portado a su hermano bloqueante spring-mvc-angular.</text>
  </g>

  <line x1="180" y1="140" x2="218" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="390" y1="140" x2="428" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="630" y1="120" x2="668" y2="95" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="630" y1="150" x2="668" y2="165" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="870" y1="160" x2="908" y2="145" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="1030" y1="170" x2="1030" y2="228" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)" />
  <text x="1035" y="205" font-size="9" fill="#991b1b">cache-aside</text>
  <line x1="1030" y1="170" x2="1030" y2="228" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="530" y1="170" x2="330" y2="238" stroke="#a21caf" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="220" y1="270" x2="182" y2="270" stroke="#a21caf" stroke-width="1.8" marker-end="url(#arrow)" />

  <text x="20" y="455" font-size="10.5" fill="#94a3b8">Hermano de Product Management (5 stacks) — mismo dominio, mismo tópico Kafka product-events, contraparte reactiva de spring-mvc-angular.</text>
</svg>
